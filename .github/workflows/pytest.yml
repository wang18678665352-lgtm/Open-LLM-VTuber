name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The unit tests only touch pure text/audio helpers, so they need a small
      # subset of the runtime dependencies instead of the full (heavy) install.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pysbd langdetect loguru pydub

      - name: Run tests
        run: pytest
